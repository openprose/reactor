name: CI - Reactor packages

# The one workflow for this repository. Everything here is Reactor, so there
# are no path filters: every PR and every push to main runs the whole gate.
#
# All of it is DETERMINISTIC and OFFLINE (REACTOR_OFFLINE=1): the package test
# suites, the example replay suites under tests/open-prose/examples/** (which
# drive the reconciler over committed replay state-dirs), and the eval-harness
# deterministic checker. The key-gated LLM judge panel is NEVER run here — no
# OPENROUTER_API_KEY secret is wired in, so it stays a passing-skipped no-op.
#
# Publishing to npm happens only on `reactor-v*` tags, through OIDC trusted
# publishing (see the `publish` job and RELEASE.md).

on:
  pull_request:
  push:
    branches: [main]
    tags:
      - "reactor-v*"

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    # NOTE: this job name is the required status check on main — do not rename.
    name: CI - Reactor Package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Force the offline path everywhere: no network, no model spend, and the
      # LLM judge panel stays a passing-skipped no-op (no key resolvable).
      REACTOR_OFFLINE: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
          cache-dependency-path: "pnpm-lock.yaml"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify registry signatures
        # Blocking. Every installed dependency must carry a valid npm registry
        # signature, so a tampered or unsigned tarball fails before we pack a
        # release from it. npm only sees the tree reachable from the directory
        # it runs in, and pnpm keeps each workspace package's dependencies under
        # that package — so check the root plus every publishable package.
        run: |
          set -euo pipefail
          for dir in . packages/reactor packages/reactor-cli packages/reactor-devtools; do
            echo "::group::npm audit signatures (${dir})"
            (cd "${dir}" && npm audit signatures)
            echo "::endgroup::"
          done

      - name: Dependency advisory audit (informational)
        # Non-blocking on purpose: advisories here are dominated by deep
        # transitive packages we do not control, and a permanently red gate
        # teaches everyone to ignore it. Signature verification above is the
        # check that blocks; this one is a signal to read.
        run: pnpm audit --prod
        continue-on-error: true

      - name: Build reactor packages
        run: pnpm build

      - name: Test reactor packages (offline, zero model spend)
        run: pnpm test:reactor:offline

      - name: Example suites + eval-harness (offline)
        # The example replay tests alias @openprose/reactor to the dist built
        # above (see vitest.config.ts) — the SAME bytes a consumer imports.
        run: pnpm test:examples

      - name: Pack reactor packages (validates publishability)
        id: pack
        run: |
          set -euo pipefail
          pack_dir="${RUNNER_TEMP}/reactor-pack"
          mkdir -p "${pack_dir}"
          # pnpm pack rewrites each package's `workspace:*` dependency on
          # @openprose/reactor to the concrete published version; npm pack does not.
          pnpm --dir packages/reactor pack --pack-destination "${pack_dir}"
          pnpm --dir packages/reactor-cli pack --pack-destination "${pack_dir}"
          pnpm --dir packages/reactor-devtools pack --pack-destination "${pack_dir}"
          echo "Packed tarballs:"
          ls -1 "${pack_dir}"
          echo "pack_dir=${pack_dir}" >> "$GITHUB_OUTPUT"

      - name: Upload reactor tarballs
        if: ${{ startsWith(github.ref, 'refs/tags/reactor-v') }}
        uses: actions/upload-artifact@v4
        with:
          name: reactor-tarballs
          path: ${{ steps.pack.outputs.pack_dir }}/*.tgz
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish Reactor Packages
    needs: ci
    if: ${{ startsWith(github.ref, 'refs/tags/reactor-v') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write

    env:
      NPM_CONFIG_PROVENANCE: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Setup Node.js for trusted publishing
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: "pnpm"
          cache-dependency-path: "pnpm-lock.yaml"

      - name: Upgrade npm for trusted publishing
        # Pinned to an exact version rather than tracking `latest`. This job holds an
        # `id-token: write` credential that can publish under our name, so whatever npm
        # we install here executes with that credential in scope — `latest` would hand a
        # compromised npm release straight into it, and would roll us onto new majors
        # untested. 11.19.0 clears the >=11.5.1 floor that OIDC trusted publishing needs
        # (see the publish step below). Bump deliberately after reviewing the release.
        # The version check makes a pin that did not take effect fail loudly here rather
        # than surface as a confusing failure at publish time.
        run: |
          npm install -g npm@11.19.0
          npm --version | grep -qx '11.19.0'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build reactor packages
        # Build up front so cross-package types resolve during each `pnpm pack`'s
        # prepack build — even when a package's publish is SKIPPED (idempotent re-run).
        # Without this, an already-published reactor short-circuits before its pack
        # builds `reactor/dist`, and reactor-cli / reactor-devtools then fail to resolve
        # `@openprose/reactor` (TS2307). Order matters: the SDK first.
        run: pnpm build

      - name: Publish reactor packages
        # OIDC trusted publishing: npm (>=11.5.1) exchanges the GitHub Actions id-token
        # for a short-lived npm token — no NPM_TOKEN secret needed. pnpm has NO OIDC
        # support, so we pnpm-PACK each package (which rewrites its `workspace:*` SDK
        # dependency to the concrete version and runs the prepack build) and then
        # `npm publish` the resulting tarball.
        # Each package publishes at its own package.json version (they diverge);
        # already-published versions are skipped so re-runs are idempotent. Order
        # matters — reactor first, because cli + devtools depend on the concrete
        # reactor version.
        run: |
          set -euo pipefail
          pack_dir="${RUNNER_TEMP}/reactor-publish"
          mkdir -p "${pack_dir}"
          publish_pkg() {
            local dir="$1"
            local name version slug tarball
            name="$(node -p "require('./${dir}/package.json').name")"
            version="$(node -p "require('./${dir}/package.json').version")"
            if npm view "${name}@${version}" version >/dev/null 2>&1; then
              echo "Skipping ${name}@${version} — already published."
              return 0
            fi
            echo "Packing ${name}@${version}"
            pnpm --dir "${dir}" pack --pack-destination "${pack_dir}"
            slug="$(printf '%s' "${name}" | sed 's#@##; s#/#-#g')"
            tarball="$(find "${pack_dir}" -maxdepth 1 -name "${slug}-${version}.tgz" -print -quit)"
            if [ -z "${tarball}" ]; then
              echo "::error::No tarball produced for ${name}@${version}."
              exit 1
            fi
            echo "Publishing ${tarball} (OIDC trusted publishing + provenance)"
            npm publish "${tarball}" --access public --provenance
          }
          publish_pkg packages/reactor
          publish_pkg packages/reactor-cli
          publish_pkg packages/reactor-devtools
